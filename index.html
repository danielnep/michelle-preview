/* Michelle Motion System: leveza tátil e animações discretas */
:root{--motion-soft:cubic-bezier(.22,1,.36,1);--motion-quick:cubic-bezier(.2,.75,.25,1)}
html{scroll-behavior:smooth}body{background:radial-gradient(ellipse at 83% 2%,#f8fbff 0%,#f4f7fb 42%,#f4f7fb 100%)}
.sidebar{box-shadow:9px 0 36px rgba(15,38,65,.045)}.topbar{background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.content>*{animation:softAppear .45s var(--motion-soft) both}.content>*:nth-child(2){animation-delay:45ms}.content>*:nth-child(3){animation-delay:80ms}.content>*:nth-child(4){animation-delay:115ms}.content>*:nth-child(5){animation-delay:140ms}
@keyframes softAppear{from{opacity:0;transform:translate3d(0,10px,0);filter:blur(2px)}to{opacity:1;transform:translate3d(0,0,0);filter:blur(0)}}
.btn,.nav,.sector-tile,.small-icon-btn,.stat-icon,.card,.period button,.quick button{transition:transform .36s var(--motion-soft),background-color .3s ease,color .3s ease,border-color .3s ease,box-shadow .4s var(--motion-soft)}
.card{box-shadow:0 2px 6px rgba(16,45,74,.012),0 16px 36px rgba(16,45,74,.023);border-color:#e6edf5}
.card:hover{box-shadow:0 7px 22px rgba(26,65,100,.035),0 24px 48px rgba(26,65,100,.035);border-color:#dae6f0}
.stat:hover{transform:translateY(-2px)}.sector-tile:hover{transform:translate3d(0,-3px,0);box-shadow:0 14px 30px rgba(25,73,112,.075)}
.nav:hover,.btn:hover,.small-icon-btn:hover{transform:translateY(-1px)}.nav.active:hover{transform:none}.nav:hover{background:#24435d}.nav.active{background:linear-gradient(115deg,#2d87cc,#1e629e)}
.hero{background:linear-gradient(110deg,#16395f,#2169a8 58%,#398dcc 100%);box-shadow:0 15px 35px rgba(43,117,184,.075)}
.hero:before,.hero:after{transition:transform 1.1s var(--motion-soft)}.hero:hover:before{transform:translate(-11px,12px) scale(1.06)}.hero:hover:after{transform:translate(-8px,-6px)}
.chart,.bar-fill,.progress>div,.tab,.badge{transition:all .5s var(--motion-soft)}
input.control,textarea.control,select.control{transition:border-color .25s ease,box-shadow .25s ease}
input.control:focus,textarea.control:focus,select.control:focus{border-color:#9fc8ee;box-shadow:0 0 0 4px rgba(60,145,222,.09);outline:none}
.top-assistant{display:flex;align-items:center;gap:7px;padding:8px 13px;color:#3778b7;border:1px solid #dcebf8;border-radius:999px;background:linear-gradient(105deg,#f8fbff,#f2f8fe);font-size:11px;font-weight:750;transition:all .34s var(--motion-soft);white-space:nowrap}

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(() => {'use strict';
const I={grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>', chart:'<path d="M3 3v18h18"/><path d="m7 15 5-5 4 3 5-8"/>',coi:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M7 11l3-3 3 3 4-4"/>',fac:'<path d="M4 21h16M6 21V5l6-2 6 2v16M9 9h1M14 9h1M9 13h1M14 13h1M10 21v-4h4v4"/>',rh:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 7h5M18.5 4.5v5M16 20h5"/>',com:'<path d="M3 3v18h18"/><path d="m6 15 5-5 4 3 5-8"/>',tec:'<path d="M14 7a5 5 0 0 0-6 6L3 18l3 3 5-5a5 5 0 0 0 6-6l-4 2-3-3z"/>',impl:'<path d="m12 3 9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/>',qual:'<path d="M12 2 4 6v6c0 5 3 8 8 10 5-2 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/>',port:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 13V8h8v5M10 17h4"/>',data:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 2 4 3 9 3s9-1 9-3V5M3 12c0 2 4 3 9 3s9-1 9-3"/>',report:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/>',insight:'<path d="M9 18h6M10 21h4M8 14a7 7 0 1 1 8 0c-1 1-1 3-4 3s-3-2-4-3z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',up:'<path d="M12 16V4M7 9l5-5 5 5M4 18v3h16v-3"/>',down:'<path d="M12 4v12m-5-5 5 5 5-5M4 18v3h16v-3"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',search:'<circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 9h18c0-1-3-2-3-9M10 21h4"/>',plus:'<path d="M12 4v16M4 12h16"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',alert:'<path d="m12 3 10 18H2L12 3zM12 10v4M12 17h.01"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',files:'<rect x="4" y="6" width="12" height="15" rx="2"/><path d="M9 3h9l3 3v13"/>',trash:'<path d="M3 6h18M8 6V3h8v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',send:'<path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',spark:'<path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="m19 16 .9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9z"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>'};
const icon=(id,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[id]||I.grid}</svg>`;
const sectors=[{id:'coi',name:'COI',long:'Central de Operações Integradas',short:'Chamados monitorados',unit:'eventos',metric:'Tempo médio de resposta'},{id:'fac',name:'Facilities',long:'Facilities',short:'Solicitações de manutenção',unit:'solicitações',metric:'SLA de manutenção'},{id:'rh',name:'RH',long:'Recursos Humanos',short:'Registros de RH',unit:'registros',metric:'Participação em treinamentos'},{id:'com',name:'Comercial',long:'Comercial',short:'Oportunidades comerciais',unit:'oportunidades',metric:'Taxa de conversão'},{id:'tec',name:'Técnico',long:'Técnico',short:'Ordens de serviço',unit:'OS',metric:'Deslocamentos realizados'},{id:'impl',name:'Implementação',long:'Implementação',short:'Projetos de implantação',unit:'projetos',metric:'Entregas no prazo'},{id:'qual',name:'Qualidade',long:'Qualidade',short:'Auditorias realizadas',unit:'registros',metric:'Índice de conformidade'},{id:'port',name:'Portaria Remota',long:'Portaria Remota',short:'Ligações e acessos',unit:'registros',metric:'Tempo médio de atendimento'}];
const today=new Date('2026-10-10T12:00:00'); // somente referência para a demonstração, substituída pela data atual abaixo
const current=new Date(); current.setHours(12,0,0,0);
const statuses=['Concluído','Em andamento','Pendente','Concluído','Concluído','Concluído','Em andamento','Concluído','Pendente','Concluído'];
const labels={coi:['Alarme monitorado','Ronda solicitada','Evento de CFTV','Ocorrência recebida','Apoio operacional'],fac:['Manutenção preventiva','Reparo elétrico','Revisão de instalações','Conservação predial','Solicitação de insumos'],rh:['Treinamento operacional','Controle de presença','Integração de colaborador','Avaliação de equipe','Atualização cadastral'],com:['Proposta comercial','Contato comercial','Qualificação de lead','Negociação','Renovação de contrato'],tec:['Visita corretiva','Ordem de serviço','Deslocamento técnico','Revisão de equipamento','Instalação de dispositivo'],impl:['Implantação de unidade','Instalação de sensores','Configuração de projeto','Integração de sistemas','Entrega técnica'],qual:['Auditoria de processo','Verificação de procedimento','Análise de CUC','Tratativa de não conformidade','Verificação de SLA'],port:['Ligação de interfone','Acesso autorizado','Acesso de visitante','Verificação de imagem','Solicitação de acesso']};
const clients=['Unidade Centro','Cliente Alfa','Unidade Industrial','Condomínio Solar','Cliente Horizonte','Unidade Norte','Condomínio Parque','Filial Sul','Cliente Atlas','Unidade Leste'];
function seeded(){let result=[];for(let s=0;s<sectors.length;s++){for(let i=0;i<64;i++){const sector=sectors[s],day=(i*7+s*11)%365,date=new Date(current.getTime()-day*86400000),status=statuses[(i+s*3)%statuses.length];result.push({id:`DEMO-${s+1}-${String(i+1).padStart(3,'0')}`,sector:sector.id,title:labels[sector.id][(i*3+s)%5],client:clients[(i*7+s)%10],date:date.toISOString().slice(0,10),status,source:'demo',duration:8+(i*13+s*11)%82,value:1+(i*3+s*2)%8,type:sector.id==='tec'?'ordens':sector.id==='port'?'ligacoes':sector.id==='qual'?'cuc':'geral'});}}return result;}
let imports=[],settings={operation:'Operação Michelle',goals:Object.fromEntries(sectors.map(s=>[s.id,85]))};
try{imports=JSON.parse(localStorage.getItem('michelle.imports.v2')||'[]');settings={...settings,...JSON.parse(localStorage.getItem('michelle.settings.v2')||'{}')};}catch(e){imports=[]}
const panelWelcome='Olá! Posso consultar os oito setores, resumir resultados e ajudar a interpretar indicadores. Escolha uma sugestão ou pergunte livremente.';
const generalWelcome='Bem-vinda à conversa geral! Posso ajudar com ideias, organização, textos e dúvidas simples nesta versão demonstrativa. Para conversas abertas com IA generativa, será necessária a integração online.';
function loadChats(){try{let saved=JSON.parse(localStorage.getItem('michelle.assistant.chats.v1')||'{}');return {dados:Array.isArray(saved.dados)&&saved.dados.length?saved.dados.slice(-50):[{role:'bot',text:panelWelcome}],geral:Array.isArray(saved.geral)&&saved.geral.length?saved.geral.slice(-50):[{role:'bot',text:generalWelcome}]}}catch(e){return {dados:[{role:'bot',text:panelWelcome}],geral:[{role:'bot',text:generalWelcome}]}}}
const state={page:location.hash.replace('#/','')||'geral',period:30,query:'',pending:null,chatModes:loadChats(),assistantMode:'dados',assistantOpen:false,assistantBusy:false,reportSector:'geral',reportPeriod:30,sidebar:false};
function saveChats(){try{localStorage.setItem('michelle.assistant.chats.v1',JSON.stringify(state.chatModes))}catch(e){/* Armazenamento opcional, conversa funciona sem persistência */}}

const idSector=id=>sectors.find(s=>s.id===id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum=n=>new Intl.NumberFormat('pt-BR').format(n||0); const fmtDate=d=>{if(!d)return'-';let a=String(d).slice(0,10).split('-');return a.length===3?`${a[2]}/${a[1]}/${a[0]}`:esc(d)};
function getAll(){return[...seeded(),...imports.flatMap(x=>x.rows||[])];}
function recordsFor(sector='geral',days=state.period){let threshold=new Date(current.getTime()-(days-1)*86400000).toISOString().slice(0,10);return getAll().filter(r=>(sector==='geral'||r.sector===sector)&&r.date>=threshold&&(state.query===''||`${r.title} ${r.client} ${r.id}`.toLowerCase().includes(state.query.toLowerCase())));}
const counts=rs=>({total:rs.length,done:rs.filter(r=>r.status==='Concluído').length,open:rs.filter(r=>r.status==='Em andamento').length,pending:rs.filter(r=>r.status==='Pendente').length,imported:rs.filter(r=>r.source!=='demo').length});
const percent=(a,b)=>b?Math.round(a/b*100):0;const rate=rs=>percent(counts(rs).done,rs.length);
function statusBadge(status){return `<span class="badge ${status==='Concluído'?'ok':status==='Pendente'?'danger':'warning'}">${esc(status)}</span>`}
function nav(item,label){return `<button type="button" class="nav ${state.page===item?'active':''}" data-nav="${item}">${icon(item==='geral'?'grid':item)} <span>${esc(label)}</span></button>`}
function shell(){let sec=idSector(state.page);let title=sec?sec.name:({geral:'Visão geral',data:'Base de dados',report:'Relatórios',insight:'Insights e análises',present:'Estúdio de apresentações',settings:'Configurações'}[state.page]||'Visão geral');
return `<div class="app"><div class="backdrop ${state.sidebar?'open':''}" data-close="1"></div><aside class="sidebar ${state.sidebar?'open':''}"><div class="brand"><div class="brand-icon">${icon('chart',23)}</div><div><div class="brand-name">MICHELLE</div><div class="brand-sub">INTELIGÊNCIA OPERACIONAL</div></div></div><div class="nav-scroll"><div class="nav-group"><div class="side-label">PRINCIPAL</div>${nav('geral','Visão geral')}</div><div class="nav-group"><div class="side-label">DEPARTAMENTOS</div>${sectors.map(s=>nav(s.id,s.name)).join('')}</div><div class="nav-group"><div class="side-label">GESTÃO E DADOS</div>${nav('data','Base de dados')}${nav('report','Relatórios')}${nav('present','Apresentações')}${nav('insight','Insights e análises')}${nav('settings','Configurações')}</div></div><div class="side-bottom"><div class="side-status"><span class="online-dot"></span> Ambiente de demonstração</div><div class="side-credit">Power BI Painel Completo • v2.0</div></div></aside><div class="main"><header class="topbar"><div class="row" style="gap:12px"><button aria-label="Abrir menu" class="small-icon-btn mob-toggle" data-toggle="1">${icon('menu',19)}</button><div class="crumb">Power BI Painel Completo <span style="color:#bec9d3">/</span> <strong>${esc(title)}</strong></div></div><div class="head-actions"><label class="searchbox">${icon('search',15)}<input aria-label="Pesquisar registros" id="global-search" placeholder="Buscar registros..." value="${esc(state.query)}" /></label><button type="button" class="top-assistant" data-assistant-open="1" aria-label="Abrir assistente">${icon('spark',15)} <span>Assistente</span></button><span class="badge info" style="white-space:nowrap">${imports.length?'Demo + Importados':'Dados de demonstração'}</span><div class="avatar">M</div></div></header><main class="content"><div class="print-header">POWER BI PAINEL COMPLETO | MICHELLE</div>${body()}</main><footer class="footer"><span>Power BI Painel Completo © 2026 • Ambiente de demonstração</span><span>Desenvolvido por Horizon</span></footer></div></div>${assistantDock()}`;}
const periodButtons=()=>`<div class="period" role="group" aria-label="Selecionar período">${[7,30,90,365].map(n=>`<button type="button" data-period="${n}" class="${state.period===n?'selected':''}">${n===365?'12m':n+'d'}</button>`).join('')}</div>`;
const header=(title,desc='Visão centralizada dos seus indicadores e resultados.')=>`<section class="overview-head"><div><div class="eyebrow">INTELIGÊNCIA OPERACIONAL / MICHELLE</div><h1 class="title">${esc(title)}</h1><p class="subtitle">${esc(desc)}</p></div><div class="header-buttons">${periodButtons()}<button class="btn" data-nav="report">${icon('report',14)} Gerar relatório</button><button class="btn btn-primary" data-nav="data">${icon('up',14)} Importar dados</button></div></section>`;
const hero=(title,desc,rs)=>{let c=counts(rs);return `<div class="hero"><div class="hero-left"><span class="hero-tag"><span class="online-dot" style="background:#8de6e2"></span> CENTRAL DE INDICADORES</span><h2>${esc(title)}</h2><p>${esc(desc)}</p></div><div class="hero-right"><div class="hero-metric"><b>${percent(c.done,c.total)}%</b><small>Índice de conclusão</small></div><div style="height:42px;width:1px;background:#ffffff30"></div><div class="hero-metric"><b>${fmtNum(c.total)}</b><small>Registros no período</small></div></div></div>`};
function statCards(rs,sector){let c=counts(rs),donePct=percent(c.done,c.total),avg=rs.length?Math.round(rs.reduce((a,r)=>a+(Number(r.duration)||0),0)/rs.length):0,types=sector?[
{label:idSector(sector).short,value:c.total.toLocaleString('pt-BR'),sub:'Registros neste período',ico:'files'},
{label:'Concluídos',value:fmtNum(c.done),sub:'Registros finalizados',ico:'check'},
{label:'Índice de conclusão',value:donePct+'%',sub:'Das solicitações recebidas',ico:'target'},
{label:idSector(sector).metric,value:sector==='tec'?fmtNum(rs.filter(r=>/desloc/i.test(r.title)).length):sector==='coi'||sector==='port'?avg+' min':donePct+'%',sub:'Indicador operacional',ico:sector}
]:[{label:'Total de registros',value:fmtNum(c.total),sub:'Nos oito setores',ico:'files'}, {label:'Demandas concluídas',value:fmtNum(c.done),sub:'Finalizadas no período',ico:'check'}, {label:'Eficiência operacional',value:donePct+'%',sub:'Índice de conclusão',ico:'target'}, {label:'Demandas em aberto',value:fmtNum(c.open+c.pending),sub:'Em andamento ou pendentes',ico:'clock'}];return `<div class="stats">${types.map((t,i)=>`<article class="card stat"><div class="stat-top"><span class="stat-label">${esc(t.label)}</span><span class="stat-icon" style="${i===1?'color:#169b80;background:#e9f8f1':i===3?'color:#8772d0;background:#f2f0ff':''}">${icon(t.ico,17)}</span></div><div class="stat-value">${esc(t.value)}</div><div class="stat-footer"><span>${esc(t.sub)}</span><span class="change">${icon('chart',11)} Atualizado</span></div></article>`).join('')}</div>`;}
function histogram(rs,days=state.period){let n=days===7?7:days===30?10:days===90?9:12,slots=Array.from({length:n},(_,i)=>({day:i+1,value:0,date:new Date(current.getTime()-(n-i-1)*(days/n)*86400000)}));rs.forEach(r=>{let t=new Date(r.date+'T12:00:00'),diff=Math.floor((current-t)/86400000),bin=Math.floor(diff/days*n);if(bin>=0&&bin<n)slots[n-1-bin].value++});return slots.map((b,i)=>({label:days>=365?b.date.toLocaleDateString('pt-BR',{month:'short'}):days===90?'S'+(i+1):days===30?'P'+(i+1):String(b.date.getDate()).padStart(2,'0'),value:b.value}));}
function lineChart(rs){let d=histogram(rs),max=Math.max(4,...d.map(x=>x.value)),W=800,H=260,pl=42,pr=16,pt=16,pb=32,iw=W-pl-pr,ih=H-pt-pb;let pos=(v,i)=>({x:pl+(i/(d.length-1))*iw,y:pt+(1-v/max)*ih});let pts=d.map((e,i)=>pos(e.value,i)),line=pts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' '),area=line+` L${pts.at(-1).x} ${H-pb} L${pts[0].x} ${H-pb} Z`;return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Gráfico temporal com ${d.length} períodos"> <defs><linearGradient id="linefill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3b9be5" stop-opacity=".21"/><stop offset="1" stop-color="#3b9be5" stop-opacity=".008"/></linearGradient></defs>${[0,.25,.5,.75,1].map(t=>{let y=pt+(1-t)*ih;return `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#e8eef5" stroke-dasharray="4 5"/><text x="${pl-12}" y="${y+4}" fill="#9babba" font-size="11" text-anchor="end">${Math.round(max*t)}</text>`}).join('')}<path d="${area}" fill="url(#linefill)"/><path d="${line}" fill="none" stroke="#2b8ce0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#fff" stroke="#328ee0" stroke-width="2"><title>${d[i].label}: ${d[i].value} registros</title></circle>`).join('')}${d.map((e,i)=>`<text x="${pts[i].x}" y="${H-8}" fill="#9cabb9" font-size="10.5" text-anchor="middle">${esc(e.label)}</text>`).join('')}</svg></div>`}
function bars(rs){let d=sectors.map(s=>({name:s.name,short:s.name.length>12?s.name.slice(0,11)+'…':s.name,count:rs.filter(r=>r.sector===s.id).length})),max=Math.max(...d.map(x=>x.count),1),W=650,H=250,margin=90,iw=W-margin-30,row=29;return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Comparação por setor">${d.map((e,i)=>{let y=i*row+6,w=iw*e.count/max;return `<text x="${margin-12}" y="${y+13}" text-anchor="end" fill="#71869a" font-size="11">${esc(e.short)}</text><rect x="${margin}" y="${y}" width="${iw}" height="18" rx="4" fill="#f1f5f9"/><rect x="${margin}" y="${y}" width="${w}" height="18" rx="4" fill="${i%2?'#72b8ed':'#398fd5'}"><title>${esc(e.name)}: ${e.count} registros</title></rect><text x="${margin+w+7}" y="${y+13}" fill="#436480" font-size="11" font-weight="700">${e.count}</text>`}).join('')}</svg></div>`}
function donut(rs){let c=counts(rs),data=[{name:'Concluídos',value:c.done,color:'#219f85'},{name:'Em andamento',value:c.open,color:'#388ddb'},{name:'Pendentes',value:c.pending,color:'#f3ae59'}],sum=Math.max(1,c.total),acc=0,cir=2*Math.PI*67;return `<div class="donut-block"><div class="donut"><svg viewBox="0 0 180 180" aria-label="Distribuição de status"><circle cx="90" cy="90" r="67" fill="none" stroke="#eef3f7" stroke-width="22"/>${data.map(d=>{let len=d.value/sum*cir,a=`<circle cx="90" cy="90" r="67" fill="none" stroke="${d.color}" stroke-width="22" stroke-dasharray="${len} ${cir-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 90 90)"><title>${d.name}: ${d.value}</title></circle>`;acc+=len;return a}).join('')}</svg><div class="donut-center"><strong>${c.total?percent(c.done,c.total):0}%</strong><span>Concluídos</span></div></div><div class="donut-legend">${data.map(d=>`<div><div class="line"><span class="legend-dot" style="background:${d.color}"></span>${d.name}</div><strong>${fmtNum(d.value)}</strong></div>`).join('')}</div></div>`}
function insights(rs,sector){let c=counts(rs),r=rate(rs),m=(c.pending+c.open),risk=m>c.done,alerts=[{ico:'alert',title:`${fmtNum(m)} demandas precisam de acompanhamento`,text:`${c.pending} pendentes e ${c.open} em andamento neste recorte.`},{ico:'target',title:`Índice de conclusão em ${r}%`,text:risk?'Há espaço para melhorar o fluxo de encerramento.':'Desempenho de conclusão superior ao volume em aberto.'},{ico:'clock',title:sector?`Prioridade: ${idSector(sector).name}`:'Oito setores monitorados',text:c.imported?`${c.imported} registros importados estão incluídos nesta análise.`:'Indicadores calculados com registros fictícios de demonstração.'}];return alerts;}
const insightsPanel=(rs,sector)=>`<section class="card panel"><div class="panel-head"><div><h3 class="panel-title">Insights operacionais</h3><p class="panel-sub">Pontos de atenção por regras locais</p></div>${icon('insight',18)}</div>${insights(rs,sector).map(a=>`<div class="insight"><span class="insight-mark">${icon(a.ico,16)}</span><div><h4>${esc(a.title)}</h4><p>${esc(a.text)}</p></div></div>`).join('')}<button class="btn btn-quiet" data-nav="insight" style="margin-top:14px;width:100%">Explorar análises ${icon('arrow',13)}</button></section>`;
function table(rs,limit=8){let items=[...rs].sort((a,b)=>b.date.localeCompare(a.date)||a.id.localeCompare(b.id)).slice(0,limit);if(!items.length)return `<div class="empty">Nenhum registro encontrado no período selecionado.</div>`;return `<div class="table-wrap"><table class="tbl"><thead><tr><th>Identificação</th><th>Descrição / Conta</th><th>Setor</th><th>Data</th><th>Status</th></tr></thead><tbody>${items.map(r=>`<tr><td><strong>${esc(r.id)}</strong></td><td><strong>${esc(r.title)}</strong><div style="font-size:10px;color:#a0acba;margin-top:4px">${esc(r.client)}</div></td><td>${esc(idSector(r.sector)?.name||r.sector)}</td><td>${fmtDate(r.date)}</td><td>${statusBadge(r.status)}</td></tr>`).join('')}</tbody></table></div>`}
function graphPanels(rs,sec){return `<div class="chart-area"><section class="card panel"><div class="panel-head"><div><h3 class="panel-title">Evolução de atendimentos</h3><div class="panel-sub">Volume de registros no período selecionado</div></div><span class="badge info">${state.period===365?'Últimos 12 meses':`Últimos ${state.period} dias`}</span></div>${lineChart(rs)}<div class="legend"><span class="legend-item"><span class="legend-dot" style="background:#398ddb"></span> Atendimentos registrados</span></div></section><section class="card panel"><div class="panel-head"><div><h3 class="panel-title">Distribuição de status</h3><div class="panel-sub">Situação das demandas</div></div>${icon('more',18)}</div>${donut(rs)}</section></div>`}
function pageOverview(){let rs=recordsFor();return header('Visão geral','Acompanhe a operação de ponta a ponta, com clareza e precisão.')+`<section class="studio-promo"><div class="studio-promo-icon">${icon('report',22)}</div><div><strong>Estúdio de Apresentações</strong><span>Crie apresentações executivas com os indicadores atuais e apresente em tela cheia na TV.</span></div><button class="btn btn-primary" data-nav="present">Criar apresentação ${icon('arrow',15)}</button></section>`+hero('Sua operação, sob uma nova perspectiva.','Informações dos oito departamentos, resultados, tendências e pontos de atenção em um único lugar.',rs)+statCards(rs)+graphPanels(rs)+`<div class="sector-grid">${sectors.map(s=>{let r=rs.filter(x=>x.sector===s.id);return `<button class="sector-tile" data-nav="${s.id}"><div class="tile-top"><span class="tile-icon">${icon(s.id,14)}</span>${s.name}</div><div class="tile-bottom"><div><strong>${r.length}</strong><br><small>${esc(s.unit)}</small></div><div style="color:#4197dd">${icon('arrow',16)}</div></div><div class="bar-track"><div class="bar-fill" style="width:${rate(r)}%"></div></div></button>`}).join('')}</div><div class="bottom-grid"><section class="card panel"><div class="panel-head"><div><h3 class="panel-title">Atividade recente</h3><p class="panel-sub">Últimos registros da operação</p></div><button data-nav="data" class="btn">Ver dados ${icon('arrow',13)}</button></div>${table(rs)}</section>${insightsPanel(rs)}</div>`}

function answer(q){let a=recordsFor(),c=counts(a),v=q.toLowerCase();if(/setor|departamento|mais registro|maior volume/.test(v)){let b=sectors.map(s=>({s,n:a.filter(r=>r.sector===s.id).length})).sort((x,y)=>y.n-x.n);return `O setor com mais registros no período é ${b[0]?.s.name}, com ${b[0]?.n||0} registros. Em seguida: ${b[1]?.s.name} (${b[1]?.n||0}) e ${b[2]?.s.name} (${b[2]?.n||0}).`;}if(/pendente|aberto|atras/.test(v))return `Existem ${c.pending} registros pendentes e ${c.open} em andamento, totalizando ${c.pending+c.open} demandas ainda não concluídas nos últimos ${state.period} dias.`;if(/efici|conclus|desempenho|percent/.test(v))return `A eficiência de conclusão está em ${rate(a)}%: ${c.done} registros concluídos entre ${c.total} no período. Esta é uma métrica demonstrativa, não uma medição contratual de SLA.`;if(/\bos\b|técnic|tecnic|deslocamento/.test(v)){let r=recordsFor('tec');return `O setor Técnico tem ${r.length} registros no período, incluindo ${r.filter(r=>/desloc/i.test(r.title)).length} descritos como deslocamentos. ${counts(r).pending} permanecem pendentes.`}if(/ligação|portaria|acesso/.test(v)){let r=recordsFor('port');return `Portaria Remota registra ${r.length} atendimentos/acessos no período, com ${rate(r)}% de conclusão.`}if(/resumo|geral|operação|todos|indicadores/.test(v))return `Resumo operacional (${state.period} dias): ${c.total} registros, ${c.done} concluídos, ${c.open} em andamento e ${c.pending} pendentes. ${c.imported} registros vieram de importações. Os demais são fictícios.`;return `Consigo responder sobre pendências, eficiência, volume de registros, Técnico, Portaria Remota e ranking de setores. Faça uma pergunta relacionada aos indicadores exibidos.`}
function generalAnswer(q){let v=q.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
if(/^(oi|ola|opa|bom dia|boa tarde|boa noite|e ai|tudo bem)[!?. ]*$/.test(v))return 'Olá! Tudo bem por aqui. Podemos conversar, organizar ideias ou trabalhar em textos. Que assunto você quer explorar?';
if(/seu nome|quem e voce|o que voce faz|como funciona/.test(v))return 'Sou o Assistente Michelle desta demonstração. No modo Análises consulto os indicadores do painel. Aqui na Conversa geral posso apoiar tarefas simples e ideias, mas não sou um modelo generativo conectado nesta versão.';
if(/obrigad|valeu|agradec/.test(v))return 'Por nada! Estou por aqui. 🌿';
if(/^(quanto e|calcule|calcular|resultado de|qual o resultado de)/.test(v)){let expr=v.replace(/^(quanto e|calcule|calcular|resultado de|qual o resultado de)\s*/,'').replace(/,/g,'.').replace(/x|×/g,'*').replace(/÷/g,'/').replace(/[?=]$/,'').trim();if(/^[\d.() +*/%-]+$/.test(expr)&&expr.length<80){try{let toks=expr.match(/\d+(?:\.\d+)?|[()+*/%-]/g);if(!toks||toks.join('')!==expr.replace(/\s+/g,''))throw Error();let pos=0;function parseFactor(){let t=toks[pos++];if(t==='-')return -parseFactor();if(t==='('){let n=parseSum();if(toks[pos++]!==')')throw Error();return n}if(!/^\d/.test(t))throw Error();return Number(t)}function parseTerm(){let n=parseFactor();while(['*','/','%'].includes(toks[pos])){let op=toks[pos++],b=parseFactor();n=op==='*'?n*b:op==='/'?n/b:n%b}return n}function parseSum(){let n=parseTerm();while(['+','-'].includes(toks[pos])){let op=toks[pos++],b=parseTerm();n=op==='+'?n+b:n-b}return n}let res=parseSum();if(pos===toks.length&&Number.isFinite(res))return 'O resultado é '+new Intl.NumberFormat('pt-BR',{maximumFractionDigits:6}).format(res)+'.';}catch(e){}}return 'Posso calcular operações aritméticas simples, por exemplo: “Quanto é 125 + 87?”.';}
if(/ideia|melhorar|inova|produtividade|equipe|processo/.test(v))return 'Uma boa melhoria começa pelo gargalo certo. Três caminhos práticos: (1) mapear onde as tarefas mais atrasam, (2) definir um responsável e um prazo por etapa, (3) comparar semanalmente o tempo de execução e os retrabalhos. Quer focar pessoas, atendimento ou processos?';
if(/organiz|planej|prioriz|rotina|agenda|meu dia/.test(v))return 'Podemos montar um roteiro simples: primeiro, escolha a entrega mais importante; depois, reserve um bloco sem interrupções; por fim, agrupe tarefas rápidas e separe dez minutos para revisar pendências. Posso ajudar a adaptar isso à sua rotina.';
if(/mensagem|texto|e-mail|email|comunicad|escrev|cliente|proposta/.test(v))return 'Uma mensagem profissional funciona melhor quando tem contexto, objetivo e próximo passo. Exemplo: “Olá! Estou entrando em contato para alinhar [assunto]. Nossa proposta é [ação], com previsão de [prazo]. Fico à disposição para confirmarmos os próximos passos.”. Nesta demonstração, consigo oferecer modelos simples.';
if(/o que acha|opiniao|conversar|desabaf|falar sobre/.test(v))return 'Podemos conversar sobre isso. Nesta prévia, minhas respostas gerais seguem algumas regras locais e são limitadas. Uma integração com IA generativa permitirá acompanhar assuntos livres com mais profundidade.';
return 'Entendi sua mensagem. Este modo geral já permite trocar mensagens, mas ainda usa respostas locais limitadas. Para conversar livremente sobre qualquer assunto, a versão final precisará da IA generativa conectada. Você também pode usar o modo Análises para consultar os dados atuais da operação.';
}

function normalizeDate(x){if(x instanceof Date&&!isNaN(x))return x.toISOString().slice(0,10);if(typeof x==='number'&&x>20000&&x<90000){let d=new Date(Date.UTC(1899,11,30)+x*86400000);return d.toISOString().slice(0,10)}if(typeof x==='string'){let d=x.trim(),match=d.match(/^(\d{2})\/(\d{2})\/(\d{4})/);if(match)return `${match[3]}-${match[2]}-${match[1]}`;if(/^\d{4}-\d{2}-\d{2}/.test(d))return d.slice(0,10)}return current.toISOString().slice(0,10)}

function normalizeRows(rows,sec,type,name){return rows.map((r,i)=>{let status=String(field(r,'status','situa','andamento')).toLowerCase(),rawstatus=/concl|finaliz|resolv|atendid|fechad|executad/.test(status)?'Concluído':/pend|aguard|aberto|atras|cancel/.test(status)?'Pendente':'Em andamento';let n=field(r,'cliente','conta','condomin','empresa','unidade','local');let title=field(r,'descri','assunto','motivo','tipo','servi','ocorr','solicit','titulo');return{id:'IMP-'+name.replace(/[^a-z0-9]/gi,'').slice(0,4).toUpperCase()+'-'+(i+1),sector:sec,title:String(title||((type==='ordens'?'Ordem de serviço':type==='deslocamentos'?'Deslocamento':type==='cuc'?'Motivo de CUC':type==='ligacoes'?'Ligação':'Registro importado')+' '+(i+1))).slice(0,145),client:String(n||'Não identificado').slice(0,90),date:normalizeDate(field(r,'data','date','dia','criacao','abertura')),status:rawstatus,source:name,type,duration:Number(field(r,'tempo','duracao','minutos','dur'))||0,value:1,raw:r}})}
function parseCSV(text){let first=text.split(/\r?\n/).find(x=>x.trim())||'',delimiter=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',',lines=[],cur='',row=[],quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(c===delimiter&&!quoted){row.push(cur);cur=''}else if((c==='\r'||c==='\n')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);if(row.some(x=>String(x).trim()))lines.push(row);row=[];cur=''}else cur+=c;}row.push(cur);if(row.some(x=>String(x).trim()))lines.push(row);let header=lines.shift()?.map((s,i)=>s.trim()||'Coluna '+(i+1))||[];return lines.map(r=>Object.fromEntries(header.map((h,i)=>[h,r[i]??''])))}
async function handleFile(file){if(!file)return;try{if(file.size>12*1024*1024)throw Error('Arquivo muito grande. Limite de 12 MB nesta demonstração.');let rows;const isCsv=/\.csv$/i.test(file.name);if(isCsv){rows=parseCSV(await file.text())}else{if(!window.XLSX)throw Error('Leitor Excel indisponível. Conecte-se à internet ou exporte o arquivo como CSV.');let wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true}),tab=wb.SheetNames.find(x=>XLSX.utils.sheet_to_json(wb.Sheets[x]).length)||wb.SheetNames[0];rows=XLSX.utils.sheet_to_json(wb.Sheets[tab],{defval:''})}if(!rows?.length)throw Error('Nenhuma linha de dados foi encontrada no arquivo.');let n=file.name.toLowerCase(),sector=n.includes('liga')?'port':n.includes('cuc')?'qual':'tec',type=n.includes('desloc')?'deslocamentos':n.includes('ordem')?'ordens':n.includes('cuc')?'cuc':n.includes('liga')?'ligacoes':'geral';state.pending={name:file.name,rows:rows.slice(0,20000),sector,type};notify(`${rows.length} linhas lidas. Revise e confirme.`);render()}catch(e){notify(e.message||'Não foi possível abrir este arquivo.',true)}}

function confirmImport(){let p=state.pending;if(!p)return;let arr=normalizeRows(p.rows,p.sector,p.type,p.name),n={id:'f'+Date.now(),name:p.name,sector:p.sector,type:p.type,created:current.toISOString().slice(0,10),rows:arr};imports.push(n);if(!saveImports()){imports.pop();return;}state.pending=null;notify(`${arr.length} registros integrados ao painel.`);render()}

<script>
/* Estúdio Michelle: gerador determinístico de narrativas executivas. Sem IA externa. */
(()=>{'use strict';
const b=window.MichelleBridge;
if(!b)return;
const KEY='michelle.studio.v1';
const templates={executivo:{name:'Resumo executivo',about:'Visão estratégica, indicadores-chave, riscos e decisões.'},operacional:{name:'Panorama operacional',about:'Fluxo de trabalho, pendências, desempenho e prioridades.'},resultados:{name:'Resultados e evolução',about:'Conquistas, tendência, comparativo e próximos passos.'},comparativo:{name:'Comparativo de setores',about:'Ranking entre departamentos, diferenças e oportunidades.'},diretoria:{name:'Reunião de diretoria',about:'Narrativa curta para decisões, riscos e encaminhamentos.'}};
const defaultConfig=()=>({title:'Panorama da operação',template:'executivo',theme:'azul',period:30,quantity:7,scope:'todos',sectors:b.getSectors().map(s=>s.id),notes:'',speaker:'Michelle'});
let st={config:defaultConfig(),slides:[],selected:0,playing:false,position:0,generatedAt:null};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved){st.config={...defaultConfig(),...saved.config};st.slides=Array.isArray(saved.slides)?saved.slides.slice(0,20):[];st.generatedAt=saved.generatedAt||null;}}catch{}

function rec(){const c=st.config;const chosen=c.scope==='todos'?sectors.map(s=>s.id):c.sectors;const rows=b.getRecords('geral',c.period);return rows.filter(r=>chosen.includes(r.sector));}
function shape(){let r=rec();let c=b.counts(r),total=r.length,ok=total?Math.round(100*c.done/total):0;let by=sectors.filter(s=>(st.config.scope==='todos'||st.config.sectors.includes(s.id))).map(s=>{let arr=r.filter(x=>x.sector===s.id);return {label:s.name,total:arr.length,done:arr.filter(x=>x.status==='Concluído').length,pending:arr.filter(x=>x.status!=='Concluído').length}});by.sort((a,b)=>b.total-a.total);return {r,c,total,ok,by,pending:c.pending+c.open,avg:total?Math.round(r.reduce((x,y)=>x+(Number(y.duration)||0),0)/total):0};}
const newSlide=(kind,kicker,title,subtitle='',points=[],metrics=[])=>({id:Math.random().toString(36).slice(2),kind,kicker,title,subtitle,points,metrics});
const bullets=(arr)=>arr.filter(Boolean).slice(0,5);
const pct=(n,d)=>d?Math.round(n/d*100)+'%':'0%';
function generate(){const c=st.config,m=shape(),selected=st.config.scope==='todos'?'oito setores':st.config.sectors.map(sectorLabel).join(', '),date=new Date().toLocaleDateString('pt-BR'),arr=[];
let add=(kind,kicker,title,subtitle,points,metrics)=>arr.push(newSlide(kind,kicker,title,subtitle,points||[],metrics||[]));

const ranking=m.by.slice(0,5).map(s=>({label:s.label,value:s.total}));
const highlights=bullets([`Foram registrados ${m.total} atendimentos nos últimos ${c.period} dias.`,`${m.c.done} demandas concluídas (${m.ok}% de conclusão).`,`${m.pending} demandas ainda precisam de acompanhamento.`,m.by[0]?`Maior volume observado em ${m.by[0].label}.`:null]);
const issues=m.by.filter(s=>s.pending).sort((a,b)=>b.pending-a.pending).slice(0,4).map(s=>`${s.label}: ${s.pending} demanda(s) ainda em aberto.`);
const noData=m.total===0;
if(c.template==='executivo'){
 add('cover','RELATÓRIO EXECUTIVO',c.title,`Resultados dos últimos ${c.period} dias • ${selected}`);
 add('metrics','VISÃO GERAL','Os números que importam','Indicadores calculados com os registros disponíveis.',[],standard);
 add('bars','PERFIL DA OPERAÇÃO','Volume por departamento','Distribuição dos registros por setor.',[],ranking);
 add('points','EVOLUÇÃO','O que os indicadores revelam','Síntese operacional do período.',highlights);
 add('metrics','SITUAÇÃO ATUAL','Concluído x em aberto','Acompanhe o andamento dos registros.',[],[{value:String(m.c.done),label:'Concluídos'},{value:String(m.c.open),label:'Em andamento'},{value:String(m.c.pending),label:'Pendentes'}]);
 add('points','PONTOS DE ATENÇÃO','Onde concentrar esforços','Prioridades sugeridas pelos registros.',issues.length?issues:['Sem pendências no período. Validar recorrência e manter acompanhamento.']);
 add('points','PRÓXIMAS DECISÕES','Transformar dados em ação','Sugestão de pauta para a próxima reunião.',bullets(['Definir responsável pelas demandas em aberto.','Revisar os indicadores com maior variação.','Atualizar o painel após novos registros.','Acompanhar evolução no próximo encontro.']));
 add('final','ENCERRAMENTO','Decisões com mais clareza','Obrigada! • Estúdio de Apresentações Michelle');
}else if(c.template==='operacional'){
 add('cover','OPERAÇÃO EM FOCO',c.title,`Acompanhamento operacional • ${c.period} dias`);
 add('metrics','ROTINA','Volume e produtividade','Panorama das solicitações e atendimentos.',[],standard);
 add('bars','DEPARTAMENTOS','Onde o trabalho acontece','Volume de registros por equipe.',[],ranking);
 add('metrics','CONTROLE DE STATUS','Fluxo das demandas','Registros finalizados e em acompanhamento.',[],[{value:String(m.c.done),label:'Encerrados'},{value:String(m.c.open),label:'Em andamento'},{value:String(m.c.pending),label:'Pendentes'}]);
 add('points','GARGALOS','Pendências a acompanhar','Pontos que merecem monitoramento.',issues.length?issues:['Não foram identificadas pendências no período.']);

}else if(c.template==='resultados'){
 add('cover','RESULTADOS',c.title,`Balanço de desempenho • ${c.period} dias`);

 add('metrics','TEMPO E EXECUÇÃO','Ciclo das solicitações','Média simples de duração e andamento.',[],[{value:m.avg+' min',label:'Duração média registrada'},{value:String(m.c.done),label:'Finalizadas'},{value:m.ok+'%',label:'Índice de conclusão'}]);
 add('points','OPORTUNIDADES','Onde podemos melhorar','Oportunidades identificadas.',issues.length?issues:['Manter o acompanhamento para preservar os resultados.']);

}else if(c.template==='comparativo'){
 add('cover','COMPARATIVO',c.title,`Setores e produtividade • ${c.period} dias`);

 add('points','DESTAQUES','Equipes em evidência','Diferenças de volume entre setores.',bullets(m.by.slice(0,4).map(s=>`${s.label}: ${s.total} registros e ${pct(s.done,s.total)} concluídos.`)));
 add('points','MELHORIAS','Onde estão as pendências','Acompanhamento por área.',issues.length?issues:['Nenhuma demanda em aberto nos setores selecionados.']);
 add('final','CONCLUSÕES','Comparar para priorizar','Uma visão integrada das equipes.');
}else{
 add('cover','REUNIÃO DE DIRETORIA',c.title,`Material de decisão • ${date}`);

 add('points','RISCOS E ATENÇÃO','O que pede uma decisão','Demandas ainda abertas.',issues.length?issues:['Nenhuma pendência identificada no conjunto selecionado.']);
 add('points','ENCAMINHAMENTOS','Decisões propostas','Ações objetivas para deliberação.',bullets(['Designar responsáveis pelas pendências.','Priorizar o tratamento de casos críticos.','Definir prazo para atualização dos indicadores.']));
 add('final','PRÓXIMO CICLO','Decidir. Executar. Medir.','Acompanhamento contínuo da operação.');
}
if(noData)arr.forEach(x=>{if(x.kind==='metrics')x.subtitle='Nenhum registro disponível no filtro; importe uma planilha ou altere a seleção.'});
// Alguns modelos possuem menos slides nativamente: adiciona slides relevantes de aprofundamento ou reduz conforme quantidade selecionada.
const extra=[newSlide('bars','VISÃO COMPLEMENTAR','Participação das equipes','Distribuição adicional de volume.',[],ranking),newSlide('points','RECOMENDAÇÕES','Foco da próxima semana','Medidas que ajudam a organizar prioridades.',bullets(['Revisar dados lançados por setor.','Resolver pendências com data mais antiga.','Apresentar indicadores na próxima reunião.'])),newSlide('metrics','INDICADORES DE STATUS','Demanda e resolução','Consolidado das atividades.',[],[{value:String(m.c.done),label:'Concluídos'},{value:String(m.pending),label:'Abertos'},{value:m.ok+'%',label:'Conclusão'}])];
while(arr.length<c.quantity&&extra.length)arr.splice(arr.length-1,0,extra.shift());
if(arr.length>c.quantity){const last=arr[arr.length-1];arr.splice(c.quantity-1);arr[c.quantity-1]=last;}
st.slides=arr;st.selected=0;st.generatedAt=new Date().toISOString();persist();b.render();b.notify(`${arr.length} slides criados com os indicadores selecionados.`);

 if(slide.kind==='metrics'){content=`<div class="slide-nums">${(slide.metrics||[]).slice(0,3).map(m=>`<div class="slide-num"><strong>${esc(m.value)}</strong><span>${esc(m.label)}</span></div>`).join('')}</div>`;}
 if(slide.kind==='bars'){let bars=(slide.metrics||[]).slice(0,5),max=Math.max(1,...bars.map(x=>x.value||0));content=`<div class="slide-bars">${bars.map(x=>`<div class="slide-bar-row"><span>${esc(x.label)}</span><div class="slide-track"><span class="slide-fill" style="width:${Math.round(100*x.value/max)}%"></span></div><b>${esc(x.value)}</b></div>`).join('')}</div>`;}
 if(slide.kind==='points')content=`<ul class="slide-points">${(slide.points||[]).slice(0,5).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
 return `<section class="studio-slide theme-${esc(theme)} ${isCover?'cover':''}" aria-label="Slide ${index+1}: ${esc(slide.title)}"><div class="slide-topline"><span>MICHELLE / INTELIGÊNCIA OPERACIONAL</span><span>${String(index+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</span></div><div class="slide-main"><div class="slide-kicker">${esc(slide.kicker)}</div><h2 class="slide-title">${esc(slide.title)}</h2>${slide.subtitle?`<p class="slide-subtitle">${esc(slide.subtitle)}</p>`:''}${content}</div><div class="slide-bottomline"><span>POWER BI PAINEL COMPLETO • ${st.config.period} DIAS</span><span>HORIZON</span></div></section>`;
}

'disabled'}>${b.icon('down',14)} Baixar HTML</button><button class="btn btn-primary" data-studio-present ${slides.length?'':'disabled'}>${b.icon('chart',14)} Apresentar na TV</button></div></div><div class="studio-stage" style="margin-top:17px">${currentSlide?slideMarkup(currentSlide,st.selected,slides.length,c.theme):`<div class="studio-empty"><b>Sua apresentação vai aparecer aqui</b><span>Selecione um modelo e clique em Gerar apresentação.</span></div>`}</div>${slides.length?`<div class="studio-slides-list" role="tablist" aria-label="Selecionar slide">${slides.map((sl,i)=>`<button type="button" role="tab" aria-selected="${st.selected===i}" class="studio-thumb ${st.selected===i?'active':''} ${c.theme}" data-studio-slide="${i}"><span class="studio-thumb-screen">${esc(sl.title)}</span><small>${String(i+1).padStart(2,'0')} · ${esc(sl.kicker)}</small></button>`).join('')}</div>`:''}</section>${currentSlide?`<section class="studio-panel"><div class="studio-toolbar"><div><h3>3. Ajustar o slide ${st.selected+1}</h3><small>O texto pode ser modificado antes da apresentação.</small></div><div class="studio-editor-controls"><button class="btn" title="Mover slide para a esquerda" data-studio-move="-1" ${st.selected===0?'disabled':''}>${b.icon('arrow',14)} Anterior</button><button class="btn" title="Mover slide para a direita" data-studio-move="1" ${st.selected===slides.length-1?'disabled':''}>Próximo ${b.icon('arrow',14)}</button></div></div><div class="studio-editor" style="margin-top:15px"><div class="studio-field"><label for="studio-slide-title">Título deste slide</label><input id="studio-slide-title" maxlength="110" value="${esc(currentSlide.title)}"/></div><div class="studio-field"><label for="studio-slide-sub">Subtítulo</label><input id="studio-slide-sub" maxlength="200" value="${esc(currentSlide.subtitle||'')}"/></div><div class="studio-field" style="grid-column:1/-1"><label for="studio-slide-content">${currentSlide.kind==='points'?'Itens, uma linha por tópico':currentSlide.kind==='metrics'?'Indicadores (valor | legenda, uma linha por indicador)':currentSlide.kind==='bars'?'Barras (nome | quantidade, uma linha por barra)':'Mensagem adicional'}</label><textarea id="studio-slide-content" placeholder="Edite os tópicos">${esc(currentSlide.kind==='points'?currentSlide.points.join('\n'):['metrics','bars'].includes(currentSlide.kind)?currentSlide.metrics.map(m=>`${m.value} | ${m.label}`).join('\n'):currentSlide.subtitle||'')}</textarea></div></div><p class="studio-help" style="margin-top:11px">A edição é salva automaticamente neste navegador.</p></section>`:''}<section class="studio-panel"><h3>4. Apresentar na TV</h3><p class="studio-hint">A apresentação é feita no próprio navegador. Confira os slides e, quando estiver pronta, clique em <strong>Apresentar na TV</strong>. O modo de exibição ocupa toda a tela.</p><div class="studio-actions"><button class="btn btn-primary" data-studio-present ${slides.length?'':'disabled'}>Iniciar apresentação ${b.icon('arrow',14)}</button><button class="btn" data-studio-print ${slides.length?'':'disabled'}>Imprimir slide / PDF</button></div><p class="studio-help" style="margin-top:12px"><strong>Durante a apresentação:</strong> use as setas do teclado ou os botões para avançar, e Esc para sair. Sem explicações sobre conexão à TV: a exibição está pronta.</p></section></div></div></div>`;}
function updateCurrent(field,value){if(!st.slides[st.selected])return;st.slides[st.selected][field]=value;persist();updatePreview();}
function updatePreview(){const slide=st.slides[st.selected];if(!slide)return;const stage=document.querySelector('.studio-stage');if(stage)stage.innerHTML=slideMarkup(slide,st.selected,st.slides.length,st.config.theme);const thumb=document.querySelector(`[data-studio-slide="${st.selected}"] .studio-thumb-screen`);if(thumb)thumb.textContent=slide.title;}

function download(){const content=st.slides.map((s,i)=>slideMarkup(s,i,st.slides.length,st.config.theme));const css=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n')+'\n'+[...document.styleSheets].filter(x=>x.href&&x.href.includes('studio.css')).map(x=>{try{return [...x.cssRules].map(y=>y.cssText).join('\n')}catch{return ''}}).join('\n');const doc=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(st.config.title)} | Michelle</title><style>${css}\nbody{margin:0;background:#07182b;color:#fff}.offline-stage{min-height:100dvh;display:grid;place-items:center;padding:10px}.offline-stage>.studio-slide{width:min(calc((100dvh - 94px)*16/9),100%);max-height:calc(100dvh - 94px)}.offline-bar{position:fixed;bottom:0;left:0;right:0;background:#061426;color:#fff;display:flex;justify-content:center;gap:20px;align-items:center;padding:14px;font:600 13px system-ui}.offline-bar button{background:#184b7c;color:#fff;border:1px solid #386d9a;border-radius:4px;padding:9px 15px;cursor:pointer}@media print{.offline-bar{display:none}.offline-stage>.studio-slide{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="offline-stage" id="stage">${content[0]}</div><div class="offline-bar"><button onclick="step(-1)">← Anterior</button><span id="number">1 / ${content.length}</span><button onclick="step(1)">Próximo →</button><button onclick="document.documentElement.requestFullscreen?.()">Tela cheia</button></div><script>const slides=${JSON.stringify(content).replace(/</g,'\\u003c')};let i=0;function step(n){i=Math.max(0,Math.min(slides.length-1,i+n));document.getElementById('stage').innerHTML=slides[i];document.getElementById('number').textContent=(i+1)+' / '+slides.length}addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();step(1)}if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}});<\/script></body></html>`;
const blob=new Blob([doc],{type:'text/html;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='apresentacao-michelle.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);}
function handleClick(e){let t=e.target.closest('[data-studio-generate],[data-studio-slide],[data-studio-move],[data-studio-present],[data-tv-prev],[data-tv-next],[data-tv-close],[data-studio-html],[data-studio-print]');if(!t)return;
if(t.matches('[data-tv-close]')){finish();return}if(t.matches('[data-tv-prev]')){moveTv(-1);return}if(t.matches('[data-tv-next]')){moveTv(1);return}
if(t.matches('[data-studio-present]')){start();return}if(t.matches('[data-studio-html]')){download();return}if(t.matches('[data-studio-print]')){const old=st.selected;st.selected=old;window.print();return}if(t.matches('[data-studio-generate]')){if(st.config.scope==='selecionados'&&!st.config.sectors.length){b.notify('Selecione ao menos um setor.',true);return}generate();return}if(t.hasAttribute('data-studio-slide')){st.selected=+t.dataset.studioSlide;b.render();return}if(t.hasAttribute('data-studio-move')){let dir=+t.dataset.studioMove,next=st.selected+dir;if(next<0||next>=st.slides.length)return;[st.slides[st.selected],st.slides[next]]=[st.slides[next],st.slides[st.selected]];st.selected=next;persist();b.render();}}
function handleInput(e){const el=e.target;if(!el.id&&!el.name&&!el.dataset.studioSector)return;const c=st.config;
const ids={'studio-title':'title','studio-template':'template','studio-period':'period','studio-quantity':'quantity','studio-scope':'scope'};if(ids[el.id]){c[ids[el.id]]=['period','quantity'].includes(ids[el.id])?Number(el.value):el.value;if(el.id==='studio-template'){const note=document.getElementById('studio-template-about');if(note)note.textContent=templates[c.template]?.about||''}if(el.id==='studio-scope'){document.getElementById('studio-sector-choices').hidden=c.scope==='todos'}persist();return}
if(el.dataset.studioSector){c.sectors=sectors.filter(s=>document.querySelector(`[data-studio-sector="${s.id}"]`)?.checked).map(s=>s.id);persist();return}
if(el.name==='studio-theme'){c.theme=el.value;persist();updatePreview();document.querySelector('.studio-slide')?.classList.remove('theme-azul','theme-graphite','theme-claro');document.querySelector('.studio-slide')?.classList.add('theme-'+c.theme);document.querySelectorAll('.studio-thumb').forEach(t=>{t.classList.remove('azul','graphite','claro');t.classList.add(c.theme)});return}
if(el.id==='studio-slide-title')updateCurrent('title',el.value);
if(el.id==='studio-slide-sub')updateCurrent('subtitle',el.value);
if(el.id==='studio-slide-content'){let slide=st.slides[st.selected];if(!slide)return;let items=el.value.split('\n').filter(x=>x.trim());if(slide.kind==='points')slide.points=items.slice(0,5);else if(slide.kind==='metrics'||slide.kind==='bars')slide.metrics=items.slice(0,5).map(x=>{let [left,...right]=x.split('|');return slide.kind==='bars'?{label:(left||'').trim(),value:Number(right.join('|').replace(/[^\d.-]/g,''))||0}:{value:(left||'').trim(),label:right.join('|').trim()}});else slide.subtitle=el.value;persist();updatePreview();}}
document.addEventListener('click',handleClick);
document.addEventListener('input',handleInput);document.addEventListener('change',handleInput);
document.addEventListener('keydown',e=>{if(st.playing){if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();moveTv(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();moveTv(-1)}else if(e.key==='Escape'){finish()}}});
document.addEventListener('fullscreenchange',()=>{if(st.playing&&!document.fullscreenElement){/* Esc encerra a exibição; o modo permanece navegável até Sair. */}});
window.MichelleStudio={page,generate,getSlides:()=>st.slides};
if(b.getState().page==='present')b.render();
})();

</script>
