name: Sigware parser | QA de branch
on:
  push:
    branches:
      - 'agent/chat-michelle-sigware-ai-coi-20261018'
    paths:
      - 'server/sigware-resilient-parser.mjs'
      - 'tests/sigware-resilient-parser.test.cjs'
      - '.github/workflows/sigware-branch-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe ESM
        run: node --check server/sigware-resilient-parser.mjs
      - name: Executar testes de parser sem Docker nem dependencias
        run: node --test tests/sigware-resilient-parser.test.cjs
