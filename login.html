<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | PowerBI Completo MC</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#080b11;color:#f5f7fc}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:22px}
main{width:min(100%,430px);border:1px solid #344052;border-radius:20px;padding:28px;background:#111824}
mark{background:#1d4265;color:#9addff;border-radius:10px;padding:8px 12px}h1{font-size:1.7rem;margin:24px 0 8px}p{color:#bcc9d9;line-height:1.5}
label{display:block;margin:18px 0 8px}input,button{font:inherit;border-radius:10px;width:100%;padding:14px}
input{background:#080f1b;color:white;border:1px solid #4b5b71}button{margin-top:24px;background:#42b7fa;color:#061522;border:0;font-weight:800;cursor:pointer}
#error{min-height:1.5em;color:#ffb5ac;margin-top:12px}small{color:#8fa1b5}
</style></head><body><main><mark>MC</mark><h1>PowerBI Completo MC</h1><p>Acesso aos relatórios e planilhas protegidas.</p>
<form id="login"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required minlength="12">
<button id="submit">Entrar no painel</button><div id="error" role="alert"></div></form>
<small>O acesso é individual. Solicite suas credenciais à administradora.</small><p><a style="color:#80d4ff" href="/recuperar-senha.html">Esqueci minha senha</a></p></main>
<script>document.querySelector("#login").addEventListener("submit",async e=>{
e.preventDefault();const button=document.querySelector("#submit"),err=document.querySelector("#error");button.disabled=true;err.textContent="";
try{const res=await fetch("/api/auth/sign-in/email",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({email:document.querySelector("#email").value.trim(),password:document.querySelector("#password").value})});
if(!res.ok){err.textContent="Não foi possível entrar. Confira o e-mail e a senha.";return;}location.replace("/");}
catch(_){err.textContent="Servidor indisponível. Tente novamente."}finally{button.disabled=false}});
fetch("/api/me",{credentials:"same-origin"}).then(r=>{if(r.ok)location.replace("/")}).catch(()=>{});
</script></body></html>
